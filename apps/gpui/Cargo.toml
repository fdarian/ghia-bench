[package]
name = "mailbox-gpui"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "Mailbox-GPUI"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# Writes a PNG of the window after the first frames and exits. Never part of the release build.
snapshot = ["gpui_platform/test-support", "dep:image"]

[profile.release]
lto = true
